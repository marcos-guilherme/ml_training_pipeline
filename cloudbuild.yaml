steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/${PROJECT_ID}/train-model:latest', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${PROJECT_ID}/train-model:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'train-model'
      - '--image=gcr.io/${PROJECT_ID}/train-model:latest'
      - '--region=us-central1'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=1800'
      - '--allow-unauthenticated'
      - '--set-env-vars=MLFLOW_TRACKING_URI=${_MLFLOW_TRACKING_URI},MLFLOW_TRACKING_USERNAME=${_MLFLOW_USERNAME}'
      - '--set-secrets=MLFLOW_TRACKING_PASSWORD=mlflow_tracking_password:latest'

substitutions:
  _MLFLOW_TRACKING_URI: 'https://mlflow-tracking-server-459145800613.us-central1.run.app'
  _MLFLOW_USERNAME: 'mlflow_user'

options:
  logging: CLOUD_LOGGING_ONLY
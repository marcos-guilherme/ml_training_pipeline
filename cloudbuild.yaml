steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - gcloud
      - functions
      - deploy
      - train_model
      - --gen2
      - --runtime=python311
      - --region=us-central1
      - --source=.
      - --entry-point=train_model
      - --trigger-http
      - --allow-unauthenticated
      - --memory=4Gi
      - --timeout=1800
      - --set-env-vars=GCP_PROJECT=${PROJECT_ID},MLFLOW_TRACKING_URI=${_MLFLOW_TRACKING_URI},MLFLOW_TRACKING_USERNAME=${_MLFLOW_USERNAME}
      - --set-secrets=MLFLOW_TRACKING_PASSWORD=mlflow_tracking_password:latest

substitutions:
  _MLFLOW_TRACKING_URI: 'https://mlflow-tracking-server-459145800613.us-central1.run.app'
  _MLFLOW_USERNAME: 'mlflow_user'

options:
  logging: CLOUD_LOGGING_ONLY